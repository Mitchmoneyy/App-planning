# Rebuilds the world's places of worship:
# Overture Maps + OpenStreetMap + approved user suggestions -> de-duplicated,
# normalised -> vector tiles (PMTiles) -> published -> loaded into Postgres.
#
# Runs by itself. Every night it checks the latest published stats: while the
# OpenStreetMap download isn't complete it runs again (each run continues
# where the last stopped), and on the 2nd of each month it refreshes
# everything. Once complete, nights in between are skipped in seconds.
# The site reads .../releases/latest/download/places.pmtiles, which always
# points at the newest build.
#
# Secrets (all optional):
#   DATABASE_URL                      export approved suggestions, load the places table
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,  upload places.pmtiles to Cloudflare R2
#   R2_SECRET_ACCESS_KEY, R2_BUCKET
# Without R2, the tiles are attached to a GitHub release instead.
name: Places pipeline

on:
  schedule:
    - cron: "41 7 * * *" # every night, 07:41 UTC (decides below whether there's work to do)
  workflow_dispatch:
    inputs:
      osm:
        description: "Also download OpenStreetMap via Overpass (up to ~3 h per run; resumes next run)"
        type: boolean
        default: true

permissions:
  contents: write

# Never two builds at once (they share the download progress and the release).
concurrency:
  group: places-pipeline
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        name: Is there work to do?
        run: |
          run=false
          reason="nothing to do: OpenStreetMap is complete and it isn't refresh day"
          if [ "${{ github.event_name }}" != "schedule" ]; then run=true; reason="started by hand"; fi
          if [ "$(date -u +%d)" = "02" ]; then run=true; reason="monthly refresh"; fi
          complete=$(curl -sfL "https://github.com/${{ github.repository }}/releases/latest/download/stats.json" | jq -r '.osm.download.complete // false' 2>/dev/null || echo false)
          if [ "$complete" != "true" ] && [ "$run" = "false" ]; then run=true; reason="OpenStreetMap download not complete yet"; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Run the pipeline: $run ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install pyarrow fsspec aiohttp shapely

      - name: Overture Maps places (~10 min)
        run: python pipeline/overture_places.py --release latest --out pipeline/in/overture

      # The full OpenStreetMap download can take longer than one run allows, so
      # progress is cached: each run continues where the last one stopped, and
      # the tiles are built from whatever has been downloaded so far.
      - name: Restore OpenStreetMap progress
        if: ${{ github.event_name == 'schedule' || inputs.osm }}
        uses: actions/cache/restore@v4
        with:
          path: pipeline/in/osm
          key: osm-${{ github.run_id }}
          restore-keys: osm-

      - name: OpenStreetMap places of worship + building outlines (Overpass)
        if: ${{ github.event_name == 'schedule' || inputs.osm }}
        continue-on-error: true
        timeout-minutes: 215
        run: node pipeline/osm_overpass.mjs --out pipeline/in/osm --max-minutes 200

      - name: Save OpenStreetMap progress
        if: ${{ always() && (github.event_name == 'schedule' || inputs.osm) }}
        uses: actions/cache/save@v4
        with:
          path: pipeline/in/osm
          key: osm-${{ github.run_id }}

      - name: Building outlines for landmarks (Overture Buildings)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          mkdir -p pipeline/in
          node pipeline/landmark_targets.mjs > pipeline/in/targets.ndjson
          python pipeline/overture_footprints.py pipeline/in/targets.ndjson pipeline/in/footprints.ndjson

      - name: Approved user suggestions
        run: node pipeline/export_suggestions.mjs pipeline/in/suggestions.ndjson

      - name: Merge, de-duplicate, build tiles
        run: node --max-old-space-size=12000 pipeline/build.mjs --in pipeline/in --out pipeline/out/world

      - name: Publish tiles to Cloudflare R2
        if: ${{ env.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 cp pipeline/out/world/places.pmtiles "s3://$R2_BUCKET/places.pmtiles" --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

      - name: Publish tiles to a GitHub release
        if: ${{ env.R2_BUCKET == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="places-$(date -u +%Y-%m)"
          # Each month gets its own release; the newest is "latest", which the site reads.
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --latest --title "Places of worship $(date -u +%B\ %Y)" --notes-file pipeline/out/world/stats.json
          gh release upload "$tag" pipeline/out/world/places.pmtiles pipeline/out/world/stats.json --clobber

      - name: Load the places table (search, near me)
        if: ${{ env.DATABASE_URL != '' }}
        run: node scripts/db-load-places.mjs pipeline/out/world/places.ndjson.gz

      - uses: actions/upload-artifact@v5
        with:
          name: places-stats
          path: pipeline/out/world/stats.json
